name: DSH plugin

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run test:python
      - run: npm run build
      - run: git diff --exit-code -- dist runtime/bridge.py runtime/SOURCE.json
      - run: npx playwright install --with-deps chromium --only-shell
        if: matrix.os == 'ubuntu-latest'
      - run: npm run test:browser
        if: matrix.os == 'ubuntu-latest'
      - run: npm run test:package
